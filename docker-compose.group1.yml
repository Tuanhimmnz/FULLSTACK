services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "${SQLSERVER_PORT:-14333}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ProjectHub@2026}
    volumes:
      - projecthub-group1-sql-data:/var/opt/mssql

  project-service:
    build:
      context: ./Microservices/ProjectService
    ports:
      - "${PROJECT_SERVICE_PORT:-5001}:5001"
    environment:
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__ProjectDb: "Server=${SQLSERVER_HOST:-sqlserver},1433;Database=ProjectDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-ProjectHub@2026};TrustServerCertificate=True;"
      Jwt__Secret: ${JWT_SECRET:-ProjectHub.Shared.Secret.Key.For.Student.Microservices.2026!}
      Jwt__Issuer: ${JWT_ISSUER:-ProjectHub}
      Jwt__Audience: ${JWT_AUDIENCE:-ProjectHub.Client}
      Services__NotifyService: ${NOTIFY_SERVICE_URL:-http://notify-service:5003}
    depends_on:
      - sqlserver
    restart: unless-stopped

volumes:
  projecthub-group1-sql-data:
